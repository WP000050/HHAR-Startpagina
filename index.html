<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HHAR Loginhelper</title>

<style>
body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:linear-gradient(135deg,#2f4f8f,#4e73c2);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    text-align:center;
    background:white;
    color:#2f4f8f;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    max-width:700px;
    width:90%;
}

.logo{
    max-width:180px;
    max-height:120px;
}

h1{
    margin-top:20px;
    margin-bottom:10px;
}

.school{
    color:#666;
    margin-bottom:30px;
}

.button{
    display:block;
    width:100%;
    max-width:350px;
    margin:12px auto;
    padding:18px;
    border:none;
    border-radius:12px;
    background:#2f4f8f;
    color:white;
    font-size:18px;
    font-weight:600;
    text-decoration:none;
    transition:.2s;
}

.button:hover{
    background:#24407a;
    transform:translateY(-2px);
}

.note{
    margin-top:25px;
    font-size:14px;
    color:#777;
}
</style>

</head>
<body>

<div class="container">

    <!-- Plaats hier het schoollogo -->
    <img src="Logo_HHAR.png" alt="HHAR Logo" class="logo class="school">
        Heilig Hartschool Sint-Katelijne-Waver
    </div>

    <!-- Pas later eventueel de bestandsnaam aan -->
    <a classper.html
        Microsoft 365 Loginhelper
    </a>

    <a class="button" href="https://www.hhartschool-skw.be/" target="_blank">
        Bezoek de schoolwebsite
    </a>

    <div class="note">
        Leerlingen loggen in met hun account
        <strong>@leerling.hh-skw.be</strong>
    </div>

</div>

</body>
</html>
