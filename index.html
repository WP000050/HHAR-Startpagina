<!DOCTYPE html>
<html lang='nl'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1.0'>
<title>HHAR Startpagina</title>
<style>
:root{--heart-red:#b93643;--heart-red-dark:#8f2330;--warm:#fffdf9;--cream:#f8f3ea;--line:#eadfd5;--radius:24px}
*{box-sizing:border-box}body{margin:0;padding:10px;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,var(--warm),var(--cream))}
.page-shell{max-width:1400px;margin:auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.hero{min-height:170px;padding:20px 30px;color:#fff;background:linear-gradient(115deg,rgba(112,22,35,.93),rgba(185,54,67,.78))}
.topbar{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center;color:#fff;text-decoration:none}.logo{max-height:70px}
h1{margin:0;font-size:clamp(28px,4vw,42px)}.hero-copy{margin-top:15px}.hero-copy p{font-size:16px;margin-top:8px}
main{padding:20px 24px}.login-panel{max-width:760px;margin:-35px auto 20px;padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.input-row{display:grid;grid-template-columns:1fr auto;gap:12px}input{padding:15px;border-radius:12px;border:2px solid #decfc4;font-size:18px}.scan-button{padding:0 18px;background:var(--heart-red);color:#fff;border:0;border-radius:12px}
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{padding:18px;border:1px solid var(--line);border-radius:var(--radius)}
.app-grid,.toolbox-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{min-height:58px;border:0;border-radius:14px;color:#fff;font-weight:700}.teams{background:#6264a7}.word{background:#2b579a}.ppt{background:#d24726}.onedrive{background:#0078d4}.outlook{background:#0072c6}.l1{background:#5f9f45}.l2{background:#78ad46}.l3{background:#d8ad29}.l4{background:#ed8734}.l5{background:#d3624e}.l6{background:#a54661}.j4{background:#75509b}.j5{background:#ba477a}
@media(max-width:850px){.content-grid{grid-template-columns:1fr}.input-row{grid-template-columns:1fr}.app-grid,.toolbox-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class='page-shell'>
<header class='hero'>
<div class='topbar'><a class='brand' href='https://www.hhartschool-skw.be/'><img class='logo' src='Logo_HHAR.png'><strong>Heilig Hartschool Sint-Katelijne-Waver</strong></a></div>
<div class='hero-copy'><h1>Jouw digitale startpagina</h1><p>Scan je QR-code of typ je S-nummer.</p></div>
</header>
<main>
<section class='login-panel'><div class='input-row'><input id='snummer' placeholder='s123456'><button class='scan-button'>📷 Scan QR-code</button></div></section>
<div class='content-grid'>
<div class='card'><h2>Microsoft 365</h2><div class='app-grid'><button class='btn teams'>Teams</button><button class='btn word'>Word</button><button class='btn ppt'>PowerPoint</button><button class='btn onedrive'>OneDrive</button><button class='btn outlook'>Outlook</button></div></div>
<div class='card'><h2>Toolboxen</h2><div class='toolbox-grid'><button class='btn l1'>L1</button><button class='btn l2'>L2</button><button class='btn l3'>L3</button><button class='btn l4'>L4</button><button class='btn l5'>L5</button><button class='btn l6'>L6</button><button class='btn j4'>4J</button><button class='btn j5'>5J</button></div></div>
</div>
</main></div>
</body></html>
