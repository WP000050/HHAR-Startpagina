<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b93643">

  <title>Startpagina | Heilig Hartschool Sint-Katelijne-Waver</title>

  <!--
    De configuratie wordt eerst geladen.
    config.js moet in dezelfde map staan als index.html.
  -->
  <script src="config.js"></script>

  <!-- Bibliotheek voor de QR-scanner -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <style>
    :root {
      --red: #b93643;
      --red-dark: #8f2330;
      --cream: #f8f3ea;
      --white: #fffdf9;
      --ink: #353535;
      --muted: #6c6c6c;
      --line: #eadfd5;
      --radius: 19px;
      --shadow: 0 12px 32px rgba(74, 48, 39, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--ink);
    }

    body {
      padding: 10px;
      background:
        radial-gradient(
          circle at 8% 8%,
          rgba(243, 201, 79, 0.18),
          transparent 24%
        ),
        radial-gradient(
          circle at 92% 18%,
          rgba(124, 163, 92, 0.16),
          transparent 24%
        ),
        linear-gradient(180deg, var(--white), var(--cream));
    }

    button,
    input {
      font: inherit;
    }

    .page-shell {
      width: min(1400px, 100%);
      margin: auto;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .hero {
      position: relative;
      min-height: 165px;
      padding: 17px 26px 24px;
      color: #fff;
      background:
        linear-gradient(
          115deg,
          rgba(112, 22, 35, 0.94),
          rgba(185, 54, 67, 0.80)
        ),
        url("schoolfoto.jpg") center / cover no-repeat;
      isolation: isolate;
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -70px;
      bottom: -185px;
      width: 300px;
      height: 300px;
      border: 45px solid rgba(255, 255, 255, 0.09);
      border-radius: 50%;
    }

    .topbar,
    .brand {
      display: flex;
      align-items: center;
    }

    .topbar {
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      gap: 12px;
      color: #fff;
      text-decoration: none;
    }

    .logo-frame {
      width: 95px;
      height: 70px;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 6px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(55, 14, 19, 0.23);
    }

    .logo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .logo-fallback {
      display: none;
      color: var(--red);
      font-size: 11px;
      line-height: 1.15;
      text-align: center;
      font-weight: 900;
    }

    .brand-text strong {
      display: block;
      font-size: 18px;
    }

    .brand-text span {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.85);
    }

    .website-link {
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .hero-copy {
      margin-top: 12px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff5c9;
    }

    .hero h1 {
      margin: 3px 0 0;
      font-size: clamp(27px, 3.1vw, 42px);
      line-height: 1;
    }

    .hero-copy p {
      margin: 7px 0 0;
      font-size: 15px;
      color: rgba(255, 255, 255, 0.92);
    }

    main {
      padding: 16px 22px 17px;
    }

    .login-panel {
      position: relative;
      z-index: 2;
      max-width: 840px;
      margin: -34px auto 15px;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 12px 28px rgba(83, 47, 39, 0.14);
    }

    .login-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }

    .login-top h2 {
      margin: 0;
      color: var(--red-dark);
      font-size: 21px;
    }

    .login-top p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .heart {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      color: #fff;
      background: var(--red);
      font-size: 20px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    #snummer {
      width: 100%;
      min-height: 48px;
      padding: 10px 14px;
      border: 2px solid #decfc4;
      border-radius: 13px;
      outline: none;
      background: #fffcf8;
      font-size: 17px;
    }

    #snummer:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(185, 54, 67, 0.11);
    }

    .scan-button {
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: var(--red);
      cursor: pointer;
      font-weight: 800;
    }

    .scan-button:hover {
      background: var(--red-dark);
    }

    .scan-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .input-help {
      margin: 7px 2px 0;
      color: var(--muted);
      font-size: 11px;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 13px;
    }

    .scanner-actions {
      display: none;
      margin-top: 8px;
      text-align: center;
    }

    .stop-button {
      padding: 7px 15px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #666;
      cursor: pointer;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .card {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 7px 19px rgba(80, 52, 38, 0.07);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 11px;
    }

    .card-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      color: #fff;
      background: var(--red);
      font-size: 18px;
    }

    .card h2 {
      margin: 0;
      color: var(--red-dark);
      font-size: 21px;
    }

    .card-subtitle {
      margin: 1px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .app-grid,
    .toolbox-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .app-button,
    .toolbox-button {
      position: relative;
      min-height: 47px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 5px 12px rgba(46, 38, 35, 0.12);
      transition:
        filter 0.15s ease,
        transform 0.15s ease;
    }

    .app-button::after,
    .toolbox-button::after {
      content: "›";
      position: absolute;
      right: 12px;
      font-size: 21px;
      opacity: 0.72;
    }

    .app-button:hover,
    .toolbox-button:hover {
      filter: brightness(1.07);
      transform: translateY(-1px);
    }

    .app-symbol {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 14px;
    }

    .teams {
      background: #6264a7;
    }

    .word {
      background: #2b579a;
    }

    .powerpoint {
      background: #d24726;
    }

    .onedrive {
      background: #0078d4;
    }

    .outlook {
      grid-column: 1 / -1;
      background: #0072c6;
    }

    .toolbox-notice {
      margin-bottom: 9px;
      padding: 7px 10px;
      border: 1px solid #ead17c;
      border-radius: 10px;
      color: #6a5210;
      background: #fff8dc;
      font-size: 11px;
    }

    .toolbox-notice.configured {
      border-color: #bed7ae;
      color: #315c25;
      background: #f1faed;
    }

    .toolbox-notice.config-error {
      border-color: #e2a5a5;
      color: #7a2424;
      background: #fff0f0;
    }

    .toolbox-button {
      min-height: 42px;
      justify-content: center;
      padding-right: 31px;
      font-size: 15px;
    }

    .toolbox-button.not-configured {
      opacity: 0.58;
      filter: grayscale(0.35);
    }

    .toolbox-button.not-configured:hover {
      transform: none;
      filter: grayscale(0.35);
    }

    .l1 {
      background: #5f9f45;
    }

    .l2 {
      background: #78ad46;
    }

    .l3 {
      background: #d8ad29;
    }

    .l4 {
      background: #ed8734;
    }

    .l5 {
      background: #d3624e;
    }

    .l6 {
      background: #a54661;
    }

    .j4 {
      background: #75509b;
    }

    .j5 {
      background: #ba477a;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 850px) {
      body {
        padding: 0;
      }

      .page-shell {
        border: 0;
        border-radius: 0;
      }

      .hero {
        min-height: 190px;
        padding: 15px 18px 48px;
      }

      .website-link {
        display: none;
      }

      .brand-text strong {
        font-size: 15px;
      }

      .logo-frame {
        width: 78px;
        height: 60px;
      }

      .hero-copy {
        margin-top: 15px;
      }

      main {
        padding: 14px;
      }

      .login-panel {
        margin: -38px auto 13px;
      }

      .content-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 14px;
      }
    }

    @media (max-width: 560px) {
      .brand-text span {
        font-size: 11px;
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      .scan-button {
        width: 100%;
      }

      .app-grid {
        grid-template-columns: 1fr;
      }

      .outlook {
        grid-column: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>
